name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PhoneGuard.zip -d app_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon
        working-directory: app_project
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-apk
          path: app_project/build/outputs/apk/debug/*.apk
